<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PT Clinical Case Exam Simulator (100 Questions)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Sarabun', sans-serif; }
  </style>
</head>
<body class="bg-[#18181b] text-zinc-100 min-h-screen flex items-center justify-center p-4 sm:p-8 selection:bg-blue-600 selection:text-white">

  <div class="w-full max-w-3xl bg-[#1f1f23] rounded-2xl border border-zinc-800/80 p-6 sm:p-10 shadow-2xl">
    
    <div class="flex flex-wrap items-center justify-between gap-3 pb-5 mb-6 border-b border-zinc-800/80">
      <div class="flex items-center gap-2 text-xs sm:text-sm text-zinc-400 bg-zinc-900/80 px-3.5 py-1.5 rounded-lg border border-zinc-800">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
        <span>เวลาปัจจุบัน:</span>
        <span id="currentClock" class="font-mono font-semibold text-zinc-200">--:--:--</span>
      </div>

      <div class="flex items-center gap-2 text-xs sm:text-sm bg-zinc-900/80 px-3.5 py-1.5 rounded-lg border border-zinc-800">
        <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
        <span class="text-zinc-400">เหลือเวลาสอบ:</span>
        <span id="countdownTimer" class="font-mono font-bold text-amber-400 tracking-wider text-sm sm:text-base">03:00:00</span>
      </div>
    </div>

    <header class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 mb-8">
      <div class="w-full sm:w-1/2 bg-zinc-800/80 h-2 rounded-full overflow-hidden border border-zinc-700/40">
        <div id="smoothProgressBar" class="bg-blue-500 h-full transition-all duration-300 ease-out" style="width: 1%"></div>
      </div>

      <div class="flex items-center gap-3 self-end sm:self-auto text-sm font-medium">
        <span id="counterText" class="text-zinc-400">1 / 100</span>
        <span id="wrongBadge" class="flex items-center gap-1 px-3 py-1 rounded-full bg-rose-500/20 text-rose-400 text-xs font-semibold border border-rose-500/30">
          ✕ <span id="wrongCount">0</span>
        </span>
        <span id="correctBadge" class="flex items-center gap-1 px-3 py-1 rounded-full bg-emerald-500/20 text-emerald-400 text-xs font-semibold border border-emerald-500/30">
          ✓ <span id="correctCount">0</span>
        </span>
      </div>
    </header>

    <main id="quizContent">
      <div class="mb-2 flex justify-between items-center">
        <span id="questionNumber" class="text-sm font-semibold text-zinc-400 tracking-wider">Question 1</span>
        <span id="categoryBadge" class="text-xs font-semibold px-2.5 py-0.5 rounded bg-zinc-800 text-blue-400 border border-zinc-700/50"></span>
      </div>

      <h2 id="questionPrompt" class="text-base sm:text-lg font-normal text-zinc-200 leading-relaxed mb-8"></h2>

      <div id="optionsList" class="space-y-3.5 mb-6"></div>

      <div class="mb-8 pt-2">
        <button onclick="toggleHint()" class="flex items-center gap-2 text-sm text-zinc-400 hover:text-zinc-200 transition-colors font-medium focus:outline-none">
          <span>Hint</span>
          <svg id="hintChevron" class="w-4 h-4 transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
          </svg>
        </button>
        <div id="hintContent" class="hidden mt-3 text-xs sm:text-sm text-zinc-400 bg-zinc-900/60 p-4 rounded-xl border border-zinc-800 leading-relaxed"></div>
      </div>

      <div id="explanationContainer" class="hidden mb-8 p-4 rounded-xl border text-sm leading-relaxed"></div>

      <footer class="flex items-center justify-end gap-3 pt-4 border-t border-zinc-800/80">
        <button id="prevBtn" onclick="handlePrev()" class="px-6 py-2.5 rounded-full bg-[#27272a] hover:bg-[#323236] text-zinc-300 text-sm font-medium transition-all disabled:opacity-30 disabled:cursor-not-allowed">
          Back
        </button>
        <button id="nextBtn" onclick="handleNext()" class="px-7 py-2.5 rounded-full bg-blue-600 hover:bg-blue-500 text-white text-sm font-semibold transition-all shadow-lg shadow-blue-600/20">
          Next
        </button>
      </footer>
    </main>

    <div id="resultScreen" class="hidden text-center py-8">
      <h3 class="text-2xl font-bold text-white mb-2">สรุปผลการทำแบบทดสอบวิชาที่ 03</h3>
      <p class="text-zinc-400 text-sm mb-6">กายภาพบำบัดในโรคและภาวะต่างๆ (Clinical Case Simulation)</p>
      <div id="finalScore" class="text-6xl font-extrabold text-blue-500 mb-4">0 / 100</div>
      <p id="finalComment" class="text-sm text-zinc-300 max-w-md mx-auto leading-relaxed mb-8"></p>
      <button onclick="restartQuiz()" class="px-8 py-3 rounded-full bg-blue-600 hover:bg-blue-500 text-white font-medium text-sm transition-all shadow-lg">
        ทำแบบทดสอบใหม่อีกครั้ง
      </button>
    </div>

  </div>

  <script src="questions.js"></script>

  <script>
    let currentIdx = 0;
    let userAnswers = [];
    let isHintOpen = false;

    // Timer Variables (3 ชั่วโมง = 10,800 วินาที)
    const TOTAL_SECONDS = 3 * 60 * 60;
    let remainingSeconds = TOTAL_SECONDS;
    let countdownInterval = null;

    const smoothProgressBar = document.getElementById('smoothProgressBar');
    const counterText = document.getElementById('counterText');
    const wrongCount = document.getElementById('wrongCount');
    const correctCount = document.getElementById('correctCount');
    const questionNumber = document.getElementById('questionNumber');
    const categoryBadge = document.getElementById('categoryBadge');
    const questionPrompt = document.getElementById('questionPrompt');
    const optionsList = document.getElementById('optionsList');
    const hintContent = document.getElementById('hintContent');
    const hintChevron = document.getElementById('hintChevron');
    const explanationContainer = document.getElementById('explanationContainer');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const quizContent = document.getElementById('quizContent');
    const resultScreen = document.getElementById('resultScreen');
    const currentClock = document.getElementById('currentClock');
    const countdownTimer = document.getElementById('countdownTimer');

    // --- ฟังก์ชันนาฬิกาเวลาจริง ---
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      currentClock.innerText = `${hours}:${minutes}:${seconds}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // --- ฟังก์ชันนับถอยหลัง 3 ชั่วโมง ---
    function startCountdown() {
      if (countdownInterval) clearInterval(countdownInterval);
      
      countdownInterval = setInterval(() => {
        if (remainingSeconds <= 0) {
          clearInterval(countdownInterval);
          alert("หมดเวลา 3 ชั่วโมงสำหรับการทำข้อสอบ! ระบบจะสรุปผลการสอบทันที");
          showResults();
          return;
        }

        remainingSeconds--;

        const h = Math.floor(remainingSeconds / 3600);
        const m = Math.floor((remainingSeconds % 3600) / 60);
        const s = remainingSeconds % 60;

        countdownTimer.innerText = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;

        // เตือนเมื่อเหลือน้อยกว่า 15 นาที (ตัวเลขเปลี่ยนเป็นสีแดงกระพริบ)
        if (remainingSeconds <= 15 * 60) {
          countdownTimer.className = "font-mono font-bold text-rose-500 tracking-wider text-sm sm:text-base animate-pulse";
        }
      }, 1000);
    }

    function initQuiz() {
      if (typeof quizData === 'undefined' || quizData.length === 0) {
        questionPrompt.innerText = "ไม่พบข้อมูลข้อสอบ กรุณาตรวจสอบไฟล์ questions.js";
        return;
      }
      userAnswers = Array(quizData.length).fill(null);
      startCountdown();
      renderQuestion();
    }

    function renderQuestion() {
      const q = quizData[currentIdx];

      const pct = ((currentIdx + 1) / quizData.length) * 100;
      smoothProgressBar.style.width = `${pct}%`;

      counterText.innerText = `${currentIdx + 1} / ${quizData.length}`;
      questionNumber.innerText = `Question ${currentIdx + 1}`;
      categoryBadge.innerText = q.category || "Clinical PT";
      questionPrompt.innerText = q.question;

      isHintOpen = false;
      hintContent.classList.add('hidden');
      hintChevron.style.transform = 'rotate(0deg)';
      hintContent.innerText = q.hint;

      optionsList.innerHTML = '';
      const answered = userAnswers[currentIdx] !== null;

      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = "w-full text-left p-4 rounded-xl text-sm font-medium transition-all duration-150 leading-relaxed border flex items-start ";

        if (!answered) {
          btn.className += "bg-[#27272a]/70 hover:bg-[#2e2e33] border-transparent text-zinc-200";
          btn.onclick = () => selectOption(idx);
        } else {
          btn.disabled = true;
          if (idx === q.correct) {
            btn.className += "bg-emerald-950/40 border-emerald-500/80 text-emerald-300 font-medium";
          } else if (idx === userAnswers[currentIdx]) {
            btn.className += "bg-rose-950/40 border-rose-500/80 text-rose-300";
          } else {
            btn.className += "bg-[#27272a]/30 border-transparent text-zinc-500 opacity-60";
          }
        }

        btn.innerText = opt;
        optionsList.appendChild(btn);
      });

      if (answered) {
        explanationContainer.classList.remove('hidden');
        if (userAnswers[currentIdx] === q.correct) {
          explanationContainer.className = "mb-8 p-4 rounded-xl border border-emerald-500/30 bg-emerald-950/20 text-emerald-300 text-xs sm:text-sm";
          explanationContainer.innerHTML = `<span class="font-bold block mb-1">ถูกต้อง ✓</span>${q.explanation}`;
        } else {
          explanationContainer.className = "mb-8 p-4 rounded-xl border border-rose-500/30 bg-rose-950/20 text-rose-300 text-xs sm:text-sm";
          explanationContainer.innerHTML = `<span class="font-bold block mb-1">เฉลยทางคลินิก ✕</span>${q.explanation}`;
        }
      } else {
        explanationContainer.classList.add('hidden');
      }

      prevBtn.disabled = currentIdx === 0;
      nextBtn.innerText = currentIdx === quizData.length - 1 ? 'ดูผลการทดสอบ' : 'Next';
      updateCounters();
    }

    function selectOption(idx) {
      userAnswers[currentIdx] = idx;
      renderQuestion();
    }

    function updateCounters() {
      let correct = 0, wrong = 0;
      userAnswers.forEach((ans, i) => {
        if (ans !== null) {
          if (ans === quizData[i].correct) correct++;
          else wrong++;
        }
      });
      correctCount.innerText = correct;
      wrongCount.innerText = wrong;
    }

    function toggleHint() {
      isHintOpen = !isHintOpen;
      if (isHintOpen) {
        hintContent.classList.remove('hidden');
        hintChevron.style.transform = 'rotate(180deg)';
      } else {
        hintContent.classList.add('hidden');
        hintChevron.style.transform = 'rotate(0deg)';
      }
    }

    function handlePrev() {
      if (currentIdx > 0) {
        currentIdx--;
        renderQuestion();
      }
    }

    function handleNext() {
      if (userAnswers[currentIdx] === null) {
        alert("กรุณาเลือกคำตอบก่อนทำข้อถัดไป");
        return;
      }
      if (currentIdx < quizData.length - 1) {
        currentIdx++;
        renderQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
      if (countdownInterval) clearInterval(countdownInterval);
      quizContent.classList.add('hidden');
      resultScreen.classList.remove('hidden');

      let correct = userAnswers.filter((a, i) => a === quizData[i].correct).length;
      document.getElementById('finalScore').innerText = `${correct} / ${quizData.length}`;

      const pct = (correct / quizData.length) * 100;
      const commentEl = document.getElementById('finalComment');
      if (pct >= 80) {
        commentEl.innerText = "ระดับยอดเยี่ยม! คุณมีความแม่นยำด้าน Clinical Reasoning, Biomechanics และ Safety Precautions ในระดับพร้อมสอบผ่านฉลุย";
      } else if (pct >= 60) {
        commentEl.innerText = "ผ่านเกณฑ์มาตรฐาน ควบทบทวนกลุ่มโรคที่ตอบผิดโดยเฉพาะเรื่องข้อห้ามวิกฤต (Contraindications) ทางระบบประสาทและทรวงอก";
      } else {
        commentEl.innerText = "ยังไม่ผ่านเกณฑ์ ควรกลับไปอ่านทบทวนพยาธิสรีรวิทยา กลไกชีวกลศาสตร์ และการแปลผลการตรวจพิเศษอย่างละเอียด";
      }
    }

    function restartQuiz() {
      currentIdx = 0;
      userAnswers = Array(quizData.length).fill(null);
      remainingSeconds = TOTAL_SECONDS;
      countdownTimer.className = "font-mono font-bold text-amber-400 tracking-wider text-sm sm:text-base";
      resultScreen.classList.add('hidden');
      quizContent.classList.remove('hidden');
      startCountdown();
      renderQuestion();
    }

    window.onload = initQuiz;
  </script>
</body>
</html>
